<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>BIM Hub - Lich nhan vien</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',Arial,sans-serif; background:#f0f4f8; min-height:100vh; }

    /* TOPBAR */
    .topbar { display:flex; align-items:center; justify-content:space-between; background:#1a1a2e; padding:0 24px; height:52px; position:sticky; top:0; z-index:200; }
    .topbar-left { display:flex; align-items:center; gap:10px; }
    .topbar-logo { width:30px; height:30px; background:linear-gradient(135deg,#00b4d8,#0077b6); border-radius:7px; display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; font-size:15px; }
    .topbar-title { color:#fff; font-size:16px; font-weight:700; }
    .topbar-right { display:flex; align-items:center; gap:12px; }
    .avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#00b4d8,#0096c7); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px; }
    .user-name { color:#ddd; font-size:13px; }
    .role-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; }
    .role-admin { background:#e63946; color:#fff; }
    .role-staff { background:#0096c7; color:#fff; }
    .btn-top { background:rgba(255,255,255,.12); border:none; color:#fff; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12px; text-decoration:none; transition:background .2s; font-family:inherit; }
    .btn-top:hover { background:rgba(255,255,255,.22); }

    /* NAV */
    .nav-tabs { background:#fff; border-bottom:2px solid #e8e8e8; display:flex; align-items:center; padding:0 24px; gap:4px; position:sticky; top:52px; z-index:150; }
    .nav-tab { padding:14px 20px; font-size:13.5px; font-weight:600; color:#888; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .2s; white-space:nowrap; text-decoration:none; display:flex; align-items:center; gap:7px; }
    .nav-tab:hover { color:#0096c7; }
    .nav-tab.active { color:#0077b6; border-bottom-color:#0077b6; }

    .main { padding:28px 32px; }
    .section-title { font-size:18px; font-weight:700; color:#1a1a2e; margin-bottom:16px; }

    .toast { position:fixed; bottom:24px; right:24px; background:#1a1a2e; color:#fff; padding:12px 20px; border-radius:10px; font-size:13px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:9999; transform:translateY(80px); opacity:0; transition:all .35s; }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { border-left:4px solid #52b788; }
    .toast.error   { border-left:4px solid #e63946; }
    .tooltip { position:fixed; background:#1a1a2e; color:#fff; padding:8px 12px; border-radius:8px; font-size:12px; z-index:9999; pointer-events:none; display:none; max-width:260px; line-height:1.6; box-shadow:0 4px 12px rgba(0,0,0,.2); }

    /* CONTROLS */
    .controls { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
    .grp-tabs { display:flex; gap:6px; }
    .grp-tab { padding:7px 16px; border:1.5px solid #dde2ea; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; background:#fff; color:#555; transition:all .15s; }
    .grp-tab:hover, .grp-tab.active { background:#e8f4fe; border-color:#0096c7; color:#0077b6; }
    .zoom-btn { padding:7px 14px; border:1.5px solid #dde2ea; border-radius:7px; font-size:12.5px; font-weight:600; cursor:pointer; background:#fff; color:#555; transition:all .15s; }
    .zoom-btn:hover, .zoom-btn.active { background:#e8f4fe; border-color:#0096c7; color:#0077b6; }
    .filter-input { padding:8px 14px; border:1.5px solid #dde2ea; border-radius:8px; font-size:13px; outline:none; font-family:inherit; }
    .filter-input:focus { border-color:#0096c7; }

    /* LEGEND */
    .legend { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px; font-size:12px; color:#555; align-items:center; }
    .legend-item { display:flex; align-items:center; gap:6px; }
    .legend-bar { width:28px; height:11px; border-radius:3px; }
    .legend-line { width:3px; height:16px; border-radius:2px; }

    /* STAFF WRAP — scroll cả 2 chiều, sticky thead bên trong */
    .staff-wrap {
      overflow:auto;
      max-height: calc(100vh - 230px);
      background:#fff;
      border-radius:14px;
      box-shadow:0 2px 12px rgba(0,0,0,.07);
    }

    table.staff { border-collapse:collapse; min-width:800px; }

    /* Sticky thead bên trong scroll container */
    table.staff thead th {
      position:sticky;
      top:0;
      z-index:20;
      padding:8px 10px;
      font-size:11px;
      font-weight:700;
      color:#fff;
      background:#1a1a2e;
      text-align:center;
      white-space:nowrap;
      border-right:1px solid rgba(255,255,255,.1);
    }
    table.staff thead th.today-hdr { background:#e63946; }

    /* Sticky first-col header (góc trái trên) */
    table.staff thead th:first-child {
      position:sticky;
      top:0;
      left:0;
      z-index:30;
      text-align:left;
      padding:10px 14px;
      min-width:200px;
      border-right:2px solid rgba(255,255,255,.2);
    }

    table.staff tbody td { padding:0; border-bottom:1px solid #eee; }

    /* NAME CELL — sticky left */
    .s-name-cell {
      padding:10px 14px;
      min-width:200px;
      max-width:200px;
      width:200px;
      border-right:2px solid #e8e8e8;
      vertical-align:top;
      background:#fff;
      position:sticky;
      left:0;
      z-index:10;
      box-shadow:2px 0 5px rgba(0,0,0,.05);
    }
    .s-name { font-size:13px; font-weight:700; color:#1a1a2e; margin-bottom:3px; }

    /* ROLE PILL */
    .role-pill { display:inline-block; font-size:10px; font-weight:700; padding:1px 7px; border-radius:20px; }
    .role-pill.Manager    { background:#e63946; color:#fff; }
    .role-pill.SubManager { background:#f4a261; color:#fff; }
    .role-pill.Leader     { background:#2a9d8f; color:#fff; }
    .role-pill.Staff      { background:#adb5bd; color:#fff; }

    /* SCHEDULE CELLS */
    .s-cell { position:relative; height:36px; border-right:1px solid #f0f0f0; vertical-align:middle; }
    .s-cell.we  { background:#f8f8f8; }
    .s-cell.tdy { background:#fff5f5; }
    .s-cell.tdy::before { content:""; position:absolute; top:0; bottom:0; left:50%; width:2px; background:#e63946; z-index:5; transform:translateX(-50%); }

    /* LANE BORDERS */
    .lane-first .s-cell,
    .lane-first .s-name-cell { border-top:2px solid #dde2ea; }
    .lane-last  .s-cell      { border-bottom:2px solid #dde2ea !important; }

    /* BARS */
    .s-bar { position:absolute; height:22px; border-radius:3px; top:7px; display:flex; align-items:center; padding:0 6px; font-size:9.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.15); z-index:2; transition:opacity .2s,transform .15s; }
    .s-bar:hover { opacity:.82; transform:scaleY(1.08); }

    /* GROUP HEADER */
    .grp-hdr td {
      background:linear-gradient(90deg,#f0f4f8,#f8fbff);
      padding:8px 16px;
      font-size:12px;
      font-weight:700;
      color:#0077b6;
      border-bottom:1.5px solid #dde2ea;
      border-top:2px solid #c8d8e8;
      position:sticky;
      left:0;
    }
  </style>
</head>
<body>

<nav class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">B</div>
    <span class="topbar-title">BIM Hub</span>
  </div>
  <div class="topbar-right">
    <div class="avatar" id="topAvatar">?</div>
    <span class="user-name" id="topName">...</span>
    <span class="role-badge" id="topRole"></span>
    <a class="btn-top" href="my-tasks.html">📋 Lich cua toi</a>
    <a class="btn-top admin-only" href="admin.html" style="display:none;">👥 Thanh vien</a>
    <button class="btn-top" onclick="logout()">Dang xuat</button>
  </div>
</nav>

<div class="nav-tabs">
  <a class="nav-tab" href="view-list.html">📋 Danh sach du an</a>
  <a class="nav-tab" href="view-category.html">🗂️ Theo the loai</a>
  <a class="nav-tab" href="view-schedule.html">📅 Schedule du an</a>
  <a class="nav-tab active" href="view-staff.html">👥 Lich nhan vien</a>
</div>

<div class="toast" id="toast"></div>
<div class="tooltip" id="tooltip"></div>

<div class="main">
  <div class="section-title">👥 Lich lam viec nhan vien</div>

  <div class="controls">
    <div class="grp-tabs">
      <button class="grp-tab active" onclick="setGroup('all',this)">Tat ca</button>
      <button class="grp-tab" onclick="setGroup('sekkei',this)">🏛️ 設計BIM</button>
      <button class="grp-tab" onclick="setGroup('sekou',this)">🏗️ 施工BIM</button>
    </div>
    <div style="display:flex;gap:6px;margin-left:auto;">
      <button class="zoom-btn active" onclick="setZoom('day',this)">Ngay</button>
      <button class="zoom-btn" onclick="setZoom('week',this)">Tuan</button>
      <button class="zoom-btn" onclick="setZoom('month',this)">Thang</button>
    </div>
    <input type="date" id="sStart" class="filter-input" onchange="renderStaff()"/>
    <span style="color:#888;font-size:14px;">→</span>
    <input type="date" id="sEnd" class="filter-input" onchange="renderStaff()"/>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-bar" style="background:#a8dadc;"></div><span>Khoang lam viec (mau theo du an)</span></div>
    <div class="legend-item"><div class="legend-line" style="background:#e63946;"></div><span>Hom nay</span></div>
    <span style="color:#aaa;font-size:11px;">💡 Mau giong nhau = cung du an | Moi task = 1 dong rieng</span>
  </div>

  <div class="staff-wrap">
    <div id="staffCont">
      <div style="padding:40px;text-align:center;color:#aaa;">Dang tai...</div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
const ROLE_ORDER = { 'Manager':0, 'Sub Manager':1, 'Leader':2, 'Staff':3 };
const ROLE_PILL_CLASS = {
  'Manager':'Manager','Sub Manager':'SubManager','Leader':'Leader','Staff':'Staff'
};

let sZoom  = 'day';
let sGroup = 'all';

window.onload = async () => {
  initTopbar();
  const t = new Date(), y = t.getFullYear(), m = t.getMonth();
  document.getElementById('sStart').value = fmt(new Date(y, m, 1));
  document.getElementById('sEnd').value   = fmt(new Date(y, m+1, 0));
  try {
    await loadAllData();
    renderStaff();
  } catch(e) {
    showToast('❌ Loi tai du lieu: ' + e.message, 'error');
  }
};

function visibleUsers(list) {
  return list.filter(u => u.role !== 'Admin');
}

function sortUsers(list) {
  return [...list].sort((a,b) => {
    const ra = ROLE_ORDER[a.role] ?? 99;
    const rb = ROLE_ORDER[b.role] ?? 99;
    if (ra !== rb) return ra - rb;
    return (a.name||a.email).localeCompare(b.name||b.email,'vi');
  });
}

function setGroup(g, btn) {
  sGroup = g;
  document.querySelectorAll('.grp-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderStaff();
}

function setZoom(z, btn) {
  sZoom = z;
  document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const t = new Date(), y = t.getFullYear(), m = t.getMonth(), d = t.getDate();
  if (z === 'day') {
    document.getElementById('sStart').value = fmt(new Date(y, m, 1));
    document.getElementById('sEnd').value   = fmt(new Date(y, m+1, 0));
  } else if (z === 'week') {
    document.getElementById('sStart').value = fmt(new Date(y, m, d-7));
    document.getElementById('sEnd').value   = fmt(new Date(y, m, d+35));
  } else {
    document.getElementById('sStart').value = fmt(new Date(y, m-1, 1));
    document.getElementById('sEnd').value   = fmt(new Date(y, m+4, 0));
  }
  renderStaff();
}

function renderStaff() {
  const start = new Date(document.getElementById('sStart').value);
  const end   = new Date(document.getElementById('sEnd').value);
  if (isNaN(start)||isNaN(end)||start>end) return;

  const days  = getDaysArray(fmt(start), fmt(end));
  const today = fmt(new Date());
  const CW    = sZoom==='month' ? 18 : sZoom==='week' ? 26 : 34;

  const sekkeiUsers = sortUsers(visibleUsers(allUsers.filter(u => u.group_name==='設計BIM')));
  const sekouUsers  = sortUsers(visibleUsers(allUsers.filter(u => u.group_name==='施工BIM')));

  // ── Header ──────────────────────────────────────────────────────────
  let hdr = '<th style="min-width:200px;">Nhan vien</th>';

  if (sZoom === 'month') {
    const months = {};
    days.forEach(d => { const k=d.substring(0,7); months[k]=(months[k]||0)+1; });
    Object.entries(months).forEach(([mo,cnt]) => {
      hdr += '<th colspan="'+cnt+'" style="min-width:'+(cnt*CW)+'px;">'+mo+'</th>';
    });
  } else {
    days.forEach(d => {
      const dt  = new Date(d+'T00:00:00');
      const dow = ['日','月','火','水','木','金','土'][dt.getDay()];
      const we  = isWeekend(d);
      const td  = d===today;
      hdr += '<th style="min-width:'+CW+'px;'+(we?'opacity:.45;':'')+(td?'background:#e63946;':'')+'"'+(td?' class="today-hdr"':'')+'>'+
        dt.getDate()+'<br><span style="font-size:9px;opacity:.8;">'+dow+'</span></th>';
    });
  }

  // ── Rows ────────────────────────────────────────────────────────────
  let rows = '';
  if (sGroup==='all') {
    if (sekkeiUsers.length) {
      rows += buildGroupHeader('🏛️','設計BIM',sekkeiUsers.length,days.length);
      sekkeiUsers.forEach(u => { rows += buildUserRows(u,days,today,CW); });
    }
    if (sekouUsers.length) {
      rows += buildGroupHeader('🏗️','施工BIM',sekouUsers.length,days.length);
      sekouUsers.forEach(u => { rows += buildUserRows(u,days,today,CW); });
    }
  } else {
    const users = sGroup==='sekkei' ? sekkeiUsers : sekouUsers;
    if (!users.length) {
      rows = '<tr><td colspan="'+(days.length+1)+'" style="text-align:center;padding:40px;color:#aaa;">Khong co nhan vien</td></tr>';
    } else {
      users.forEach(u => { rows += buildUserRows(u,days,today,CW); });
    }
  }

  document.getElementById('staffCont').innerHTML =
    '<table class="staff"><thead><tr>'+hdr+'</tr></thead><tbody>'+rows+'</tbody></table>';

  const renderUsers = sGroup==='all'
    ? [...sekkeiUsers,...sekouUsers]
    : (sGroup==='sekkei' ? sekkeiUsers : sekouUsers);
  renderUsers.forEach(u => drawBarsMultiLane(u,days,CW));
}

function buildGroupHeader(icon, label, count, dayCount) {
  return '<tr class="grp-hdr"><td colspan="'+(dayCount+1)+'">'+icon+' '+label+'（'+count+' nhan vien）</td></tr>';
}

function buildUserRows(u, days, today, CW) {
  const tasks     = allTasks.filter(t => t.assigned_to===u.id && t.start_date && t.end_date);
  const laneCount = Math.max(1, tasks.length);
  const pillClass = ROLE_PILL_CLASS[u.role] || 'Staff';
  let html = '';

  for (let lane=0; lane<laneCount; lane++) {
    const isFirst = lane===0;
    const isLast  = lane===laneCount-1;
    const rowClass= (isFirst?'lane-first ':'')+(isLast?'lane-last':'');

    // Name cell chỉ ở lane đầu, rowspan bao hết
    const nameCell = isFirst
      ? '<td class="s-name-cell" rowspan="'+laneCount+'">'
          +'<div class="s-name">'+(u.name||u.email)+'</div>'
          +'<span class="role-pill '+pillClass+'">'+(u.role||'Staff')+'</span>'
        +'</td>'
      : '';

    const cells = days.map(d =>
      '<td class="s-cell '+(isWeekend(d)?'we':'')+' '+(d===today?'tdy':'')+'" '+
      'style="min-width:'+CW+'px;" '+
      'data-uid="'+u.id+'" data-lane="'+lane+'" data-date="'+d+'"></td>'
    ).join('');

    html += '<tr class="'+rowClass+'" data-uid="'+u.id+'" data-lane="'+lane+'">'+nameCell+cells+'</tr>';
  }
  return html;
}

function drawBarsMultiLane(u, days, CW) {
  const tasks = allTasks.filter(t => t.assigned_to===u.id && t.start_date && t.end_date);
  if (!tasks.length) return;

  tasks.forEach((task, lane) => {
    const proj = allProjects.find(p => p.id===task.project_id);
    if (!proj) return;

    const color = projColorMap[proj.id] || '#a8dadc';
    const si    = days.indexOf(task.start_date);
    const ei    = days.indexOf(task.end_date);
    if (si<0||si>=days.length) return;

    const row = document.querySelector('tr[data-uid="'+u.id+'"][data-lane="'+lane+'"]');
    if (!row) return;
    const cells = [...row.querySelectorAll('.s-cell')];
    if (!cells[si]) return;

    const realEi = ei<0 ? days.length-1 : Math.min(ei, days.length-1);
    const barW   = Math.max((realEi-si+1)*CW-4, CW-4);

    const bar = document.createElement('div');
    bar.className = 's-bar';
    bar.style.cssText = 'left:2px;width:'+barW+'px;background:'+color+';color:'+(isLight(color)?'#333':'#fff')+';';
    const code = (proj.project_code||'').split('_')[0];
    bar.textContent = (code?'['+code+'] ':'')+proj.project_name;

    bar.addEventListener('mouseenter', e => showTooltip(e,
      '<b>'+proj.project_name+'</b>'+
      '<br>'+(task.task_type||'')+
      '<br>'+task.start_date+' → '+task.end_date+
      (task.note?'<br>📝 '+task.note:'')
    ));
    bar.addEventListener('mouseleave', hideTooltip);
    cells[si].appendChild(bar);
  });
}

function isLight(hex) {
  const c=(hex||'').replace('#','');
  if(c.length!==6) return true;
  const r=parseInt(c.substring(0,2),16);
  const g=parseInt(c.substring(2,4),16);
  const b=parseInt(c.substring(4,6),16);
  return (r*299+g*587+b*114)/1000>160;
}
</script>
</body>
</html>
