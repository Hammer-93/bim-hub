<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>BIM Hub - Schedule du an</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',Arial,sans-serif; background:#f0f4f8; min-height:100vh; }
    .topbar { display:flex; align-items:center; justify-content:space-between; background:#1a1a2e; padding:0 24px; height:52px; position:sticky; top:0; z-index:200; }
    .topbar-left { display:flex; align-items:center; gap:10px; }
    .topbar-logo { width:30px; height:30px; background:linear-gradient(135deg,#00b4d8,#0077b6); border-radius:7px; display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; font-size:15px; }
    .topbar-title { color:#fff; font-size:16px; font-weight:700; }
    .topbar-right { display:flex; align-items:center; gap:12px; }
    .avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#00b4d8,#0096c7); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px; }
    .user-name { color:#ddd; font-size:13px; }
    .role-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; }
    .role-admin { background:#e63946; color:#fff; }
    .role-staff { background:#0096c7; color:#fff; }
    .btn-top { background:rgba(255,255,255,.12); border:none; color:#fff; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12px; text-decoration:none; transition:background .2s; font-family:inherit; }
    .btn-top:hover { background:rgba(255,255,255,.22); }
    .nav-tabs { background:#fff; border-bottom:2px solid #e8e8e8; display:flex; align-items:center; padding:0 24px; gap:4px; }
    .nav-tab { padding:14px 20px; font-size:13.5px; font-weight:600; color:#888; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .2s; white-space:nowrap; text-decoration:none; display:flex; align-items:center; gap:7px; }
    .nav-tab:hover { color:#0096c7; }
    .nav-tab.active { color:#0077b6; border-bottom-color:#0077b6; }
    .main { padding:28px 32px; }
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
    .section-title { font-size:18px; font-weight:700; color:#1a1a2e; }
    .toast { position:fixed; bottom:24px; right:24px; background:#1a1a2e; color:#fff; padding:12px 20px; border-radius:10px; font-size:13px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:9999; transform:translateY(80px); opacity:0; transition:all .35s; }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { border-left:4px solid #52b788; }
    .toast.error   { border-left:4px solid #e63946; }
    .tooltip { position:fixed; background:#1a1a2e; color:#fff; padding:8px 12px; border-radius:8px; font-size:12px; z-index:9999; pointer-events:none; display:none; max-width:260px; line-height:1.6; box-shadow:0 4px 12px rgba(0,0,0,.2); }

    .controls { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
    .zoom-btn { padding:7px 14px; border:1.5px solid #dde2ea; border-radius:7px; font-size:12.5px; font-weight:600; cursor:pointer; background:#fff; color:#555; transition:all .15s; }
    .zoom-btn:hover, .zoom-btn.active { background:#e8f4fe; border-color:#0096c7; color:#0077b6; }
    .filter-input { padding:8px 14px; border:1.5px solid #dde2ea; border-radius:8px; font-size:13px; outline:none; font-family:inherit; }
    .filter-input:focus { border-color:#0096c7; }

    .legend { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:14px; font-size:12px; color:#555; align-items:center; }
    .legend-item { display:flex; align-items:center; gap:6px; }
    .legend-bar { width:28px; height:11px; border-radius:3px; }
    .legend-dot { width:11px; height:11px; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .legend-line { width:3px; height:16px; border-radius:2px; }

    .gantt-wrap { overflow-x:auto; background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,.07); }
    table.gantt { width:100%; border-collapse:collapse; min-width:800px; }
    table.gantt thead tr:first-child th { padding:6px 8px; font-size:11px; font-weight:700; color:#fff; background:#1a1a2e; text-align:center; white-space:nowrap; border-right:1px solid rgba(255,255,255,.1); }
    table.gantt thead tr:last-child th { padding:5px 4px; font-size:10px; font-weight:600; color:#fff; background:#2a2a3e; text-align:center; white-space:nowrap; border-right:1px solid rgba(255,255,255,.08); }
    table.gantt thead th.today-hdr { background:#e63946 !important; }
    table.gantt tbody td { padding:0; border-bottom:1px solid #f0f0f0; }

    /* LEFT CELL */
    .g-left { padding:8px 14px; min-width:280px; max-width:280px; border-right:2px solid #e8e8e8; vertical-align:middle; background:#fff; }
    .g-pname { font-size:13px; font-weight:700; color:#1a1a2e; display:flex; align-items:center; gap:8px; }
    .stt-badge { font-size:10px; font-weight:800; padding:1px 7px; border-radius:4px; background:#e8f4fe; color:#0077b6; flex-shrink:0; white-space:nowrap; }
    .pname-text { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .g-pcode { font-size:11px; color:#999; margin-top:2px; padding-left:30px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .g-cell { position:relative; height:38px; border-right:1px solid #f0f0f0; vertical-align:middle; }
    .g-cell.we  { background:#f8f8f8; }
    .g-cell.tdy { background:#fff5f5; }
    .g-cell.tdy::before { content:''; position:absolute; top:0; bottom:0; left:50%; width:2px; background:#e63946; z-index:5; transform:translateX(-50%); }

    .g-bar { position:absolute; height:20px; border-radius:4px; top:9px; display:flex; align-items:center; padding:0 7px; font-size:10px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,.18); z-index:2; transition:opacity .2s,transform .15s; }
    .g-bar:hover { opacity:.85; transform:scaleY(1.08); }
    .g-dot { position:absolute; width:11px; height:11px; border-radius:50%; transform:translateX(-50%); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.25); z-index:4; cursor:pointer; }
    .g-dot:hover { transform:translateX(-50%) scale(1.3); }
    .g-dot-rcv  { background:#52b788; top:6px; }
    .g-dot-send { background:#e63946; top:21px; }
  </style>
</head>
<body>

<nav class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">B</div>
    <span class="topbar-title">BIM Hub</span>
  </div>
  <div class="topbar-right">
    <div class="avatar" id="topAvatar">?</div>
    <span class="user-name" id="topName">...</span>
    <span class="role-badge" id="topRole"></span>
    <a class="btn-top" href="my-tasks.html">📋 Lich cua toi</a>
    <a class="btn-top admin-only" href="admin.html" style="display:none;">👥 Thanh vien</a>
    <button class="btn-top" onclick="logout()">Dang xuat</button>
  </div>
</nav>

<div class="nav-tabs">
  <a class="nav-tab" href="view-list.html">📋 Danh sach du an</a>
  <a class="nav-tab" href="view-category.html">🗂️ Theo the loai</a>
  <a class="nav-tab active" href="view-schedule.html">📅 Schedule du an</a>
  <a class="nav-tab" href="view-staff.html">👥 Lich nhan vien</a>
</div>

<div class="toast" id="toast"></div>
<div class="tooltip" id="tooltip"></div>

<div class="main">
  <div class="section-header">
    <div class="section-title">📅 Schedule du an</div>
  </div>

  <div class="controls">
    <button class="zoom-btn active" onclick="setZoom('day',this)">Ngay</button>
    <button class="zoom-btn" onclick="setZoom('week',this)">Tuan</button>
    <button class="zoom-btn" onclick="setZoom('month',this)">Thang</button>
    <input type="date" id="gStart" class="filter-input" onchange="renderGantt()"/>
    <span style="color:#888;font-size:14px;">→</span>
    <input type="date" id="gEnd" class="filter-input" onchange="renderGantt()"/>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#555;cursor:pointer;">
      <input type="checkbox" id="showDone" onchange="renderGantt()"/> Hien thi da ket thuc
    </label>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-bar" style="background:#a8dadc;"></div><span>Khoan lam viec</span></div>
    <div class="legend-item"><div class="legend-dot g-dot-rcv"></div><span>Nhan data (tren)</span></div>
    <div class="legend-item"><div class="legend-dot g-dot-send"></div><span>Gui (duoi)</span></div>
    <div class="legend-item"><div class="legend-line" style="background:#e63946;"></div><span>Hom nay</span></div>
  </div>

  <div class="gantt-wrap">
    <div id="ganttCont">
      <div style="padding:40px;text-align:center;color:#aaa;">Dang tai...</div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
let gZoom = 'day';

// Thứ tự ưu tiên nhóm: A=0, B=1, C=2, D=3
const GROUP_ORDER = { A:0, B:1, C:2, D:3 };

// Thứ tự ưu tiên task type
const TASK_TYPE_ORDER = {
  '意匠モデル':0,
  '構造モデル':1,
  '図面':2,
  'パース・動画':3,
  '動画・パース':3,
  '施工ステップ':4,
  '清算モデル':5
};

function getGroup(p) {
  return (p.proj_group || p.project_group || p.group || '').toString().toUpperCase().trim();
}
function getCode(p) {
  return p.project_code || p.code || '';
}

// Lấy số năm từ mã dự án (25xxx → 25, 26xxx → 26)
function getCodeYear(p) {
  const code = getCode(p);
  const m = code.match(/^(\d+)/);
  return m ? parseInt(m[1]) : 9999;
}

// Lấy task type ưu tiên nhất của project
function getBestTaskOrder(p) {
  const tasks = allTasks.filter(t => t.project_id === p.id);
  if (!tasks.length) return 99;
  let best = 99;
  tasks.forEach(t => {
    const type = t.task_type || t.type || '';
    const ord  = TASK_TYPE_ORDER.hasOwnProperty(type) ? TASK_TYPE_ORDER[type] : 98;
    if (ord < best) best = ord;
  });
  return best;
}

// Sắp xếp: Nhóm A>B>C>D → Task type → Mã số 25>26>...
function sortProjects(projects) {
  return [...projects].sort(function(a, b) {
    const ga = GROUP_ORDER[getGroup(a)] !== undefined ? GROUP_ORDER[getGroup(a)] : 99;
    const gb = GROUP_ORDER[getGroup(b)] !== undefined ? GROUP_ORDER[getGroup(b)] : 99;
    if (ga !== gb) return ga - gb;

    const ta = getBestTaskOrder(a);
    const tb = getBestTaskOrder(b);
    if (ta !== tb) return ta - tb;

    const ca = getCodeYear(a);
    const cb = getCodeYear(b);
    return ca - cb;
  });
}

// Tạo STT map sau khi đã sắp xếp: A1,A2,... B1,B2,...
function buildSttMap(sortedProjects) {
  const counters = {};
  const map = {};
  sortedProjects.forEach(p => {
    const grp = getGroup(p) || '?';
    counters[grp] = (counters[grp] || 0) + 1;
    map[p.id] = grp + counters[grp];
  });
  return map;
}

window.onload = async () => {
  initTopbar();
  const t = new Date(), y = t.getFullYear(), m = t.getMonth();
  document.getElementById('gStart').value = fmt(new Date(y, m, 1));
  document.getElementById('gEnd').value   = fmt(new Date(y, m+1, 0));
  try {
    await loadAllData();
    renderGantt();
  } catch(e) {
    showToast('❌ Loi tai du lieu: ' + e.message, 'error');
  }
};

function setZoom(z, btn) {
  gZoom = z;
  document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const t = new Date(), y = t.getFullYear(), m = t.getMonth(), d = t.getDate();
  if (z === 'day') {
    document.getElementById('gStart').value = fmt(new Date(y, m, 1));
    document.getElementById('gEnd').value   = fmt(new Date(y, m+1, 0));
  } else if (z === 'week') {
    document.getElementById('gStart').value = fmt(new Date(y, m, d-14));
    document.getElementById('gEnd').value   = fmt(new Date(y, m, d+42));
  } else {
    document.getElementById('gStart').value = fmt(new Date(y, m-1, 1));
    document.getElementById('gEnd').value   = fmt(new Date(y, m+5, 0));
  }
  renderGantt();
}

function renderGantt() {
  const start    = new Date(document.getElementById('gStart').value);
  const end      = new Date(document.getElementById('gEnd').value);
  const showDone = document.getElementById('showDone').checked;
  if (isNaN(start) || isNaN(end) || start > end) return;

  const days  = getDaysArray(fmt(start), fmt(end));
  const today = fmt(new Date());
  const CW    = gZoom==='month' ? 20 : gZoom==='week' ? 28 : 36;

  // Lọc rồi sắp xếp
  const rawProjects = allProjects.filter(p => showDone ? true : p.status === 'active');
  const projects    = sortProjects(rawProjects);
  const sttMap      = buildSttMap(projects);

  // ── Header ──────────────────────────────────────────────
  let hdr1 = '<th rowspan="2" style="min-width:280px;text-align:left;padding:10px 14px;border-right:2px solid rgba(255,255,255,.2);">Project</th>';
  let hdr2 = '';

  if (gZoom === 'month') {
    const months = {};
    days.forEach(d => { const k = d.substring(0,7); months[k] = (months[k]||0)+1; });
    Object.entries(months).forEach(([mo, cnt]) => {
      hdr1 += '<th colspan="'+cnt+'" style="min-width:'+(cnt*CW)+'px;border-right:1px solid rgba(255,255,255,.15);">'+mo+'</th>';
    });
    days.forEach(d => {
      const dt = new Date(d);
      const we = isWeekend(d);
      const td = d === today;
      hdr2 += '<th style="min-width:'+CW+'px;'+(we?'opacity:.45':'')+(td?';background:#e63946;':'')+'">'+dt.getDate()+'</th>';
    });
  } else {
    days.forEach(d => {
      const dt  = new Date(d);
      const dow = ['日','月','火','水','木','金','土'][dt.getDay()];
      const we  = isWeekend(d);
      const td  = d === today;
      hdr1 += '<th colspan="1" style="min-width:'+CW+'px;'+(we?'opacity:.45':'')+(td?'background:#e63946 !important;':'')+(td?'class="today-hdr"':'')+'">'
        + dt.getDate()+'<br><span style="font-size:9px;opacity:.8;">'+dow+'</span></th>';
    });
  }

  // ── Rows ────────────────────────────────────────────────
  let rows = '';
  if (!projects.length) {
    rows = '<tr><td colspan="'+(days.length+1)+'" style="text-align:center;padding:40px;color:#aaa;">Khong co du an nao</td></tr>';
  }

  projects.forEach(p => {
    const color = projColorMap[p.id] || '#a8dadc';
    const tasks = allTasks.filter(t => t.project_id === p.id);
    const rs    = Math.max(tasks.length, 1);
    const stt   = sttMap[p.id] || '';
    const code  = getCode(p);
    const name  = p.project_name || p.name || '';

    // Left cell: STT + tên dự án + mã số nhỏ bên dưới
    const pCell = '<td class="g-left" rowspan="'+rs+'">'
      + '<div class="g-pname">'
        + '<span class="stt-badge">'+stt+'</span>'
        + '<span class="pname-text" title="'+name+'">'+name+'</span>'
      + '</div>'
      + (code ? '<div class="g-pcode">'+code+'</div>' : '')
      + '</td>';

    if (!tasks.length) {
      rows += '<tr>'+pCell
        + days.map(d=>'<td class="g-cell '+(isWeekend(d)?'we':'')+' '+(d===today?'tdy':'')+'" style="min-width:'+CW+'px;"></td>').join('')
        + '</tr>';
      return;
    }

    tasks.forEach((t, ti) => {
      rows += '<tr data-tid="'+t.id+'">'
        + (ti === 0 ? pCell : '')
        + days.map(d=>'<td class="g-cell '+(isWeekend(d)?'we':'')+' '+(d===today?'tdy':'')+'" style="min-width:'+CW+'px;"></td>').join('')
        + '</tr>';
    });
  });

  // ── Render ───────────────────────────────────────────────
  const thead = gZoom === 'month'
    ? '<thead><tr>'+hdr1+'</tr><tr>'+hdr2+'</tr></thead>'
    : '<thead><tr>'+hdr1+'</tr></thead>';

  document.getElementById('ganttCont').innerHTML =
    '<table class="gantt">'+thead+'<tbody>'+rows+'</tbody></table>';

  // ── Bars & dots ──────────────────────────────────────────
  projects.forEach(p => {
    const color = projColorMap[p.id] || '#a8dadc';
    allTasks.filter(t => t.project_id === p.id).forEach(t => {
      const row = document.querySelector('tr[data-tid="'+t.id+'"]');
      if (!row) return;
      const cells = [...row.querySelectorAll('.g-cell')];
      const user  = allUsers.find(u => u.id === t.assigned_to);

      if (t.start_date && t.end_date) {
        const si = days.indexOf(t.start_date);
        const ei = days.indexOf(t.end_date);
        if (si >= 0 && si < cells.length) {
          const realEi = ei < 0 ? days.length-1 : Math.min(ei, days.length-1);
          const barW   = (realEi - si + 1) * CW - 4;
          const bar    = document.createElement('div');
          bar.className = 'g-bar';
          bar.style.cssText = 'left:2px;width:'+Math.max(barW, CW-4)+'px;background:'+color+';';
          bar.textContent   = t.task_type || '';
          bar.addEventListener('mouseenter', e => showTooltip(e,
            '<b>'+(t.task_type||'')+'</b>'
            +'<br>担当: '+(user ? user.name : '未定')
            +'<br>'+t.start_date+' → '+t.end_date
            +(t.note ? '<br>📝 '+t.note : '')
          ));
          bar.addEventListener('mouseleave', hideTooltip);
          cells[si].appendChild(bar);
        }
      }

      if (t.receive_date) {
        const ri = days.indexOf(t.receive_date);
        if (ri >= 0 && ri < cells.length) {
          const dot = document.createElement('div');
          dot.className = 'g-dot g-dot-rcv';
          dot.style.left = '50%';
          dot.addEventListener('mouseenter', e => showTooltip(e, '📥 Nhan data<br>'+t.receive_date));
          dot.addEventListener('mouseleave', hideTooltip);
          cells[ri].appendChild(dot);
        }
      }

      if (t.send_date) {
        const si2 = days.indexOf(t.send_date);
        if (si2 >= 0 && si2 < cells.length) {
          const dot2 = document.createElement('div');
          dot2.className = 'g-dot g-dot-send';
          dot2.style.left = '50%';
          dot2.addEventListener('mouseenter', e => showTooltip(e, '📤 Gui<br>'+t.send_date));
          dot2.addEventListener('mouseleave', hideTooltip);
          cells[si2].appendChild(dot2);
        }
      }
    });
  });
}
</script>
</body>
</html>
