<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>BIM Hub - Schedule du an</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',Arial,sans-serif; background:#f0f4f8; min-height:100vh; }
    .topbar { display:flex; align-items:center; justify-content:space-between; background:#1a1a2e; padding:0 24px; height:52px; position:sticky; top:0; z-index:200; }
    .topbar-left { display:flex; align-items:center; gap:10px; }
    .topbar-logo { width:30px; height:30px; background:linear-gradient(135deg,#00b4d8,#0077b6); border-radius:7px; display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; font-size:15px; }
    .topbar-title { color:#fff; font-size:16px; font-weight:700; }
    .topbar-right { display:flex; align-items:center; gap:12px; }
    .avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#00b4d8,#0096c7); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px; }
    .user-name { color:#ddd; font-size:13px; }
    .role-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; }
    .role-admin { background:#e63946; color:#fff; }
    .role-staff { background:#0096c7; color:#fff; }
    .btn-top { background:rgba(255,255,255,.12); border:none; color:#fff; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12px; text-decoration:none; transition:background .2s; font-family:inherit; }
    .btn-top:hover { background:rgba(255,255,255,.22); }
    .nav-tabs { background:#fff; border-bottom:2px solid #e8e8e8; display:flex; align-items:center; padding:0 24px; gap:4px; }
    .nav-tab { padding:14px 20px; font-size:13.5px; font-weight:600; color:#888; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .2s; white-space:nowrap; text-decoration:none; display:flex; align-items:center; gap:7px; }
    .nav-tab:hover { color:#0096c7; }
    .nav-tab.active { color:#0077b6; border-bottom-color:#0077b6; }
    .main { padding:28px 32px; }
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .section-title { font-size:18px; font-weight:700; color:#1a1a2e; }
    .toast { position:fixed; bottom:24px; right:24px; background:#1a1a2e; color:#fff; padding:12px 20px; border-radius:10px; font-size:13px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:9999; transform:translateY(80px); opacity:0; transition:all .35s; }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { border-left:4px solid #52b788; }
    .toast.error   { border-left:4px solid #e63946; }
    .tooltip { position:fixed; background:#1a1a2e; color:#fff; padding:8px 12px; border-radius:8px; font-size:12px; z-index:8999; pointer-events:none; display:none; max-width:260px; line-height:1.6; box-shadow:0 4px 12px rgba(0,0,0,.2); }
    .controls { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
    .zoom-btn { padding:7px 14px; border:1.5px solid #dde2ea; border-radius:7px; font-size:12.5px; font-weight:600; cursor:pointer; background:#fff; color:#555; transition:all .15s; }
    .zoom-btn:hover,.zoom-btn.active { background:#e8f4fe; border-color:#0096c7; color:#0077b6; }
    .filter-input { padding:8px 14px; border:1.5px solid #dde2ea; border-radius:8px; font-size:13px; outline:none; font-family:inherit; }
    .filter-input:focus { border-color:#0096c7; }
    .legend { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:14px; font-size:12px; color:#555; align-items:center; }
    .legend-item { display:flex; align-items:center; gap:6px; }
    .legend-bar { width:28px; height:11px; border-radius:3px; }
    .legend-dot { width:11px; height:11px; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .gantt-wrap { overflow-x:auto; background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,.07); }
    table.gantt { border-collapse:collapse; min-width:800px; }
    .col-proj { min-width:200px; width:220px; resize:horizontal; overflow:hidden; }
    table.gantt thead tr:first-child th { padding:6px 8px; font-size:11px; font-weight:700; color:#fff; background:#1a1a2e; text-align:center; white-space:nowrap; border-right:1px solid rgba(255,255,255,.1); }
    table.gantt thead tr:last-child th { padding:5px 4px; font-size:10px; font-weight:600; color:#fff; background:#2a2a3e; text-align:center; white-space:nowrap; border-right:1px solid rgba(255,255,255,.08); }
    table.gantt thead th.today-hdr { background:#e63946 !important; }
    table.gantt tbody td { padding:0; border-bottom:1px solid #f0f0f0; }

    .g-left:hover { background:#e8f4fe; }
    .g-pname { font-size:13px; font-weight:700; color:#1a1a2e; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

    .g-cell { position:relative; height:44px; border-right:1px solid #f0f0f0; vertical-align:middle; overflow:visible; }

    .g-cell.tdy::before { content:""; position:absolute; top:0; bottom:0; left:50%; width:2px; background:#e63946; z-index:5; transform:translateX(-50%); }

    .g-bar:hover { opacity:.85; }
    .g-dot { position:absolute; width:12px; height:12px; border-radius:50%; transform:translateX(-50%); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); z-index:7; cursor:pointer; transition:transform .15s; }
    .g-dot:hover { transform:translateX(-50%) scale(1.4); }
    .g-dot-rcv  { background:#52b788; top:4px; }
    .g-dot-send { background:#e63946; top:26px; }

    .g-dot-ms-send { background:#e63946; opacity:.6; top:26px; }
    .g-dot-add  { background:#ffd166; top:15px; width:10px; height:10px; z-index:8; }

    /* MILESTONE PANEL */
    .ms-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:1000; }
    .ms-overlay.open { display:block; }
    .ms-panel { position:fixed; top:0; right:-520px; width:500px; max-width:96vw; height:100vh; background:#fff; box-shadow:-4px 0 28px rgba(0,0,0,.18); z-index:1100; transition:right .3s ease; display:flex; flex-direction:column; }

    .ms-head-text { flex:1; min-width:0; }
    .ms-head-sub { color:#00b4d8; font-size:11px; font-weight:700; margin-bottom:3px; }
    .ms-head-title { color:#fff; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .ms-x:hover { opacity:1; }
    .ms-body { flex:1; overflow-y:auto; padding:20px; }
    .ms-foot { padding:14px 20px; border-top:1px solid #eee; display:flex; gap:10px; justify-content:space-between; align-items:center; flex-shrink:0; }
    .ms-add-btn { background:#e8f4fe; color:#0077b6; border:1.5px solid #b8dff5; padding:8px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }

    .ms-item-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }

    .ms-item-del { background:none; border:1.5px solid #ffb3b3; color:#e63946; padding:3px 10px; border-radius:6px; font-size:11px; cursor:pointer; }
    .ms-item-del:hover { background:#fff0f0; }
    .ms-row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px; }
    .ms-field label { display:block; font-size:11px; font-weight:600; color:#666; margin-bottom:3px; }
    .ms-field input { width:100%; padding:7px 10px; border:1.5px solid #dde2ea; border-radius:7px; font-size:13px; outline:none; font-family:inherit; color:#222; }

    .ms-item-save { background:linear-gradient(135deg,#0096c7,#0077b6); color:#fff; border:none; padding:6px 16px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; }
    .ms-empty { text-align:center; color:#bbb; padding:30px; font-size:13px; }

    /* PROJECT META PANEL */
    .ep-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:800; }
    .ep-overlay.open { display:block; }
    .ep-panel { position:fixed; top:0; right:-480px; width:460px; max-width:96vw; height:100vh; background:#fff; box-shadow:-4px 0 28px rgba(0,0,0,.18); z-index:900; transition:right .3s ease; display:flex; flex-direction:column; }
    .ep-panel.open { right:0; }
    .ep-head { background:#1a1a2e; padding:16px 20px; display:flex; align-items:flex-start; gap:10px; flex-shrink:0; }
    .ep-head-text { flex:1; min-width:0; }
    .ep-head-code { color:#00b4d8; font-size:12px; font-weight:700; margin-bottom:3px; }
    .ep-head-name { color:#fff; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ep-x { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; opacity:.7; line-height:1; flex-shrink:0; padding:0; }
    .ep-x:hover { opacity:1; }
    .ep-body { flex:1; overflow-y:auto; padding:20px; }
    .ep-sec { margin-bottom:22px; }
    .ep-sec-title { font-size:11px; font-weight:700; color:#0077b6; text-transform:uppercase; letter-spacing:.7px; margin-bottom:10px; padding-bottom:5px; border-bottom:2px solid #e8f4fe; }
    .ep-f { margin-bottom:12px; }
    .ep-f label { display:block; font-size:11px; font-weight:600; color:#666; margin-bottom:4px; }
    .ep-f input,.ep-f textarea { width:100%; padding:8px 11px; border:1.5px solid #dde2ea; border-radius:7px; font-size:13px; outline:none; font-family:inherit; color:#222; }
    .ep-f input:focus,.ep-f textarea:focus { border-color:#0096c7; }
    .ep-f textarea { resize:vertical; min-height:80px; }
    .ep-row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .ep-foot { padding:14px 20px; border-top:1px solid #eee; display:flex; gap:10px; justify-content:flex-end; flex-shrink:0; }
    .ep-save { background:linear-gradient(135deg,#0096c7,#0077b6); color:#fff; border:none; padding:9px 24px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
    .ep-cancel { background:#fff; color:#555; border:1.5px solid #dde2ea; padding:9px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
  </style>
</head>

<script src="js/config.js"></script>
<script>
var gZoom = "day";
var currentProjId = null;
var currentMsTask = null;
var allMilestones = [];
var LS_KEY = "bimhub_proj_meta";
var GROUP_ORDER = {A:0,B:1,C:2,D:3};
var TASK_TYPE_ORDER = {"意匠モデル":0,"構造モデル":1,"図面":2,"パース・動画":3,"動画・パース":3,"施工ステップ":4,"清算モデル":5};

function getMeta(id){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}")[id]||{}; }catch(e){ return {}; } }
function setMeta(id,data){ try{ var a=JSON.parse(localStorage.getItem(LS_KEY)||"{}"); a[id]=Object.assign(a[id]||{},data); localStorage.setItem(LS_KEY,JSON.stringify(a)); }catch(e){} }

/* ── Load milestones from Supabase ── */
async function loadMilestones() {
  try {
    var res = await fetch(SUPABASE_URL+"/rest/v1/task_milestones?select=*&order=created_at.asc", {headers:HDRS});
    var data = await res.json();
    allMilestones = Array.isArray(data) ? data : [];
  } catch(e) { allMilestones = []; }
}

function getMsForTask(taskId) {
  return allMilestones.filter(function(m){ return m.task_id === taskId; });
}

/* ── MILESTONE PANEL ── */
function openMsPanel(task) {
  currentMsTask = task;
  var p = allProjects.find(function(x){ return x.id === task.project_id; });
  document.getElementById("msPanelSub").textContent = (task.task_type||"Task") + (p?" — "+getCode(p):"");
  document.getElementById("msPanelTitle").textContent = p ? (p.project_name||p.name||"") : "";
  renderMsBody();
  document.getElementById("msOverlay").classList.add("open");
  document.getElementById("msPanel").classList.add("open");
}
function closeMsPanel() {
  document.getElementById("msOverlay").classList.remove("open");
  document.getElementById("msPanel").classList.remove("open");
  currentMsTask = null;
}
function renderMsBody() {
  if(!currentMsTask) return;
  var ms = getMsForTask(currentMsTask.id);
  var body = document.getElementById("msBody");
  if(!ms.length) {
    body.innerHTML = '<div class="ms-empty">Chua co giai doan nao.<br>Bam "Them giai doan" de them moi.</div>';
    return;
  }
  var html = "";
  ms.forEach(function(m, i) {
    html += '<div class="ms-item">'
      +'<div class="ms-item-head"><span class="ms-item-num">Giai doan '+(i+1)+'</span>'
      +'<button class="ms-item-del" data-id="'+m.id+'">🗑 Xoa</button></div>'
      +'<div class="ms-row2">'
        +'<div class="ms-field"><label>📥 Ngay nhan data</label><input type="date" id="ms-rcv-'+m.id+'" value="'+(m.receive_date||"")+'"/></div>'
        +'<div class="ms-field"><label>📤 Ngay gui</label><input type="date" id="ms-snd-'+m.id+'" value="'+(m.send_date||"")+'"/></div>'
      +'</div>'
      +'<div class="ms-field"><label>📝 Ghi chu</label><input type="text" id="ms-note-'+m.id+'" value="'+(m.note||"").replace(/"/g,"&quot;")+'"/></div>'
      +'<div class="ms-save-row"><button class="ms-item-save" data-id="'+m.id+'">💾 Luu</button></div>'
      +'</div>';
  });
  body.innerHTML = html;
  body.querySelectorAll(".ms-item-save").forEach(function(btn){
    btn.addEventListener("click", function(){ saveMilestone(btn.getAttribute("data-id")); });
  });
  body.querySelectorAll(".ms-item-del").forEach(function(btn){
    btn.addEventListener("click", function(){ deleteMilestone(btn.getAttribute("data-id")); });
  });
}

async function addMilestone() {
  if(!currentMsTask) return;
  try {
    var body = JSON.stringify({task_id: currentMsTask.id});
    var res = await fetch(SUPABASE_URL+"/rest/v1/task_milestones", {
      method:"POST",
      headers: Object.assign({}, HDRS, {"Prefer":"return=representation"}),
      body: body
    });
    if(!res.ok){ var err=await res.text(); showToast("Loi: "+err,"error"); return; }
    var arr = await res.json();
    if(arr && arr.length) allMilestones.push(arr[0]);
    renderMsBody();
    renderGantt();
    showToast("Da them giai doan moi!","success");
  } catch(e){ showToast("Loi: "+e.message,"error"); }
}

async function saveMilestone(msId) {
  var rcv  = document.getElementById("ms-rcv-"+msId).value||null;
  var snd  = document.getElementById("ms-snd-"+msId).value||null;
  var note = document.getElementById("ms-note-"+msId).value.trim()||null;
  try {
    var res = await fetch(SUPABASE_URL+"/rest/v1/task_milestones?id=eq."+msId, {
      method:"PATCH", headers:HDRS,
      body:JSON.stringify({receive_date:rcv, send_date:snd, note:note})
    });
    if(!res.ok){ showToast("Loi luu","error"); return; }
    var m = allMilestones.find(function(x){return x.id===msId;});
    if(m){ m.receive_date=rcv; m.send_date=snd; m.note=note; }
    showToast("Da luu giai doan!","success");
    renderGantt();
  } catch(e){ showToast("Loi: "+e.message,"error"); }
}

async function deleteMilestone(msId) {
  if(!confirm("Xac nhan xoa giai doan nay?")) return;
  try {
    await fetch(SUPABASE_URL+"/rest/v1/task_milestones?id=eq."+msId, {method:"DELETE", headers:HDRS});
    allMilestones = allMilestones.filter(function(x){return x.id!==msId;});
    showToast("Da xoa!","success");
    renderMsBody();
    renderGantt();
  } catch(e){ showToast("Loi: "+e.message,"error"); }
}

/* ── PROJECT META PANEL ── */
function openPanel(pid) {
  var p = allProjects.find(function(x){return x.id===pid;});
  if(!p) return;
  currentProjId = pid;
  var m = getMeta(pid);
  document.getElementById("epCode").textContent = getCode(p);
  document.getElementById("epName").textContent = p.project_name||p.name||"";
  document.getElementById("epNote").value     = m.note||"";
  document.getElementById("epStaff").value    = m.staff||"";
  document.getElementById("epKoujou").value   = m.koujou||"";
  document.getElementById("epSoftware").value = m.software||"";
  document.getElementById("epVersion").value  = m.version||"";
  document.getElementById("epOverlay").classList.add("open");
  document.getElementById("epPanel").classList.add("open");
}
function closePanel() {
  document.getElementById("epOverlay").classList.remove("open");
  document.getElementById("epPanel").classList.remove("open");
  currentProjId = null;
}
function savePanel() {
  if(!currentProjId) return;
  setMeta(currentProjId,{
    note:document.getElementById("epNote").value.trim(),
    staff:document.getElementById("epStaff").value.trim(),
    koujou:document.getElementById("epKoujou").value.trim(),
    software:document.getElementById("epSoftware").value.trim(),
    version:document.getElementById("epVersion").value.trim()
  });
  showToast("Da luu!","success");
  closePanel();
  renderGantt();
}

document.addEventListener("DOMContentLoaded", function(){
  document.getElementById("msClose").addEventListener("click", closeMsPanel);
  document.getElementById("msCloseBtn").addEventListener("click", closeMsPanel);
  document.getElementById("msAddBtn").addEventListener("click", addMilestone);
  document.getElementById("msOverlay").addEventListener("click", function(e){ if(e.target===this) closeMsPanel(); });
  document.getElementById("epClose").addEventListener("click", closePanel);
  document.getElementById("epCancelBtn").addEventListener("click", closePanel);
  document.getElementById("epSaveBtn").addEventListener("click", savePanel);
  document.getElementById("epOverlay").addEventListener("click", function(e){ if(e.target===this) closePanel(); });
});

/* ── HELPERS ── */
function getGroup(p){ return (p.proj_group||p.project_group||p.group||"").toString().toUpperCase().trim(); }
function getCode(p){
  if(p.year&&p.seq_number) return p.year+String(p.seq_number).padStart(3,"0");
  return (p.code||p.project_code||"").split("_")[0]||"";
}
function getCodeNum(p){
  if(p.year&&p.seq_number) return parseInt(p.year)*1000+parseInt(p.seq_number);
  var n=parseInt(p.code||p.project_code||""); return isNaN(n)?99999:n;
}
function getBestTaskOrder(p){
  var best=99;
  allTasks.filter(function(t){return t.project_id===p.id;}).forEach(function(t){
    var o=TASK_TYPE_ORDER.hasOwnProperty(t.task_type)?TASK_TYPE_ORDER[t.task_type]:98;
    if(o<best) best=o;
  });
  return best;
}
function sortProjects(list){
  return list.slice().sort(function(a,b){
    var ga=GROUP_ORDER[getGroup(a)]!==undefined?GROUP_ORDER[getGroup(a)]:99;
    var gb=GROUP_ORDER[getGroup(b)]!==undefined?GROUP_ORDER[getGroup(b)]:99;
    if(ga!==gb) return ga-gb;
    var ta=getBestTaskOrder(a),tb=getBestTaskOrder(b);
    if(ta!==tb) return ta-tb;
    return getCodeNum(a)-getCodeNum(b);
  });
}
function buildSttMap(sorted){
  var c={},m={};
  sorted.forEach(function(p){ var g=getGroup(p)||"?"; c[g]=(c[g]||0)+1; m[p.id]=g+c[g]; });
  return m;
}

/* ── INIT ── */
window.onload = async function(){
  initTopbar();
  var t=new Date(),y=t.getFullYear(),mo=t.getMonth();
  document.getElementById("gStart").value=fmt(new Date(y,mo,1));
  document.getElementById("gEnd").value=fmt(new Date(y,mo+1,0));
  try { await loadAllData(); await loadMilestones(); renderGantt(); }
  catch(e){ showToast("Loi: "+e.message,"error"); }
};

function setZoom(z,btn){
  gZoom=z;
  document.querySelectorAll(".zoom-btn").forEach(function(b){b.classList.remove("active");});
  btn.classList.add("active");
  var t=new Date(),y=t.getFullYear(),mo=t.getMonth(),d=t.getDate();
  if(z==="day"){ document.getElementById("gStart").value=fmt(new Date(y,mo,1)); document.getElementById("gEnd").value=fmt(new Date(y,mo+1,0)); }
  else if(z==="week"){ document.getElementById("gStart").value=fmt(new Date(y,mo,d-14)); document.getElementById("gEnd").value=fmt(new Date(y,mo,d+42)); }
  else{ document.getElementById("gStart").value=fmt(new Date(y,mo-1,1)); document.getElementById("gEnd").value=fmt(new Date(y,mo+5,0)); }
  renderGantt();
}

/* ── RENDER GANTT ── */
function renderGantt(){
  var start=new Date(document.getElementById("gStart").value);
  var end=new Date(document.getElementById("gEnd").value);
  var showDone=document.getElementById("showDone").checked;
  if(isNaN(start)||isNaN(end)||start>end) return;
  var days=getDaysArray(fmt(start),fmt(end));
  var today=fmt(new Date());
  var CW=gZoom==="month"?20:gZoom==="week"?28:36;
  var raw=allProjects.filter(function(p){return showDone?true:p.status==="active";});
  var projects=sortProjects(raw);
  var sttMap=buildSttMap(projects);

  var hdr1='<th class="col-proj" rowspan="2" style="text-align:left;padding:10px 14px;border-right:1px solid rgba(255,255,255,.2);">Project</th>'
    +'<th rowspan="2" style="min-width:160px;text-align:right;padding:10px 14px;border-right:1px solid rgba(255,255,255,.2);">備考</th>'
    +'<th rowspan="2" style="min-width:110px;text-align:right;padding:10px 14px;border-right:2px solid rgba(255,255,255,.3);">Staff担当</th>';
  var hdr2="";

  if(gZoom==="month"){
    var months={};
    days.forEach(function(d){var k=d.substring(0,7);months[k]=(months[k]||0)+1;});
    Object.entries(months).forEach(function(en){
      hdr1+='<th colspan="'+en[1]+'" style="min-width:'+(en[1]*CW)+'px;border-right:1px solid rgba(255,255,255,.15);">'+en[0]+'</th>';
    });
    days.forEach(function(d){
      var dt=new Date(d),we=isWeekend(d),td=d===today;
      hdr2+='<th style="min-width:'+CW+'px;'+(we?"opacity:.45":"")+(td?";background:#e63946;":"")+'">'+(new Date(d)).getDate()+'</th>';
    });
  } else {
    days.forEach(function(d){
      var dt=new Date(d),dow=["日","月","火","水","木","金","土"][dt.getDay()],we=isWeekend(d),td=d===today;
      hdr1+='<th style="min-width:'+CW+'px;'+(we?"opacity:.45":"")+(td?"background:#e63946 !important;":"")+(td?' class="today-hdr"':"")+'">'
        +dt.getDate()+'<br><span style="font-size:9px;opacity:.8;">'+dow+'</span></th>';
    });
  }

  var rows="";
  if(!projects.length) rows='<tr><td colspan="'+(days.length+3)+'" style="text-align:center;padding:40px;color:#aaa;">Khong co du an</td></tr>';

  projects.forEach(function(p){
    var color=projColorMap[p.id]||"#a8dadc";
    var tasks=allTasks.filter(function(t){return t.project_id===p.id;});
    var rs=Math.max(tasks.length,1);
    var stt=sttMap[p.id]||"";
    var code=getCode(p);
    var name=p.project_name||p.name||"";
    var meta=getMeta(p.id);
    var swHtml="";
    if(meta.software) swHtml+='<div class="g-software">'+meta.software+(meta.version?" "+meta.version:"")+'</div>';
    if(meta.koujou)   swHtml+='<div class="g-koujou">着工 '+meta.koujou+'</div>';
    var noteVal=(meta.note||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
    var staffVal=(meta.staff||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
    var dc=days.map(function(d){
      return '<td class="g-cell '+(isWeekend(d)?"we":"")+" "+(d===today?"tdy":"")+'" style="min-width:'+CW+'px;"></td>';
    }).join("");
    var pCell='<td class="g-left" rowspan="'+rs+'" data-pid="'+p.id+'">'
      +'<div class="g-pname"><span class="stt-badge">'+stt+'</span><span class="pname-text">'+name+'</span></div>'
      +'<div class="g-pcode">'+code+'</div>'+swHtml+'</td>';
    var bicoCell='<td class="g-bico" rowspan="'+rs+'">'+noteVal+'</td>';
    var staffCell='<td class="g-staff" rowspan="'+rs+'">'+staffVal+'</td>';
    if(!tasks.length){ rows+="<tr>"+pCell+bicoCell+staffCell+dc+"</tr>"; return; }
    tasks.forEach(function(t,ti){
      rows+='<tr data-tid="'+t.id+'">'+(ti===0?pCell+bicoCell+staffCell:"")+dc+"</tr>";
    });
  });

  var thead=gZoom==="month"?"<thead><tr>"+hdr1+"</tr><tr>"+hdr2+"</tr></thead>":"<thead><tr>"+hdr1+"</tr></thead>";
  document.getElementById("ganttCont").innerHTML='<table class="gantt">'+thead+"<tbody>"+rows+"</tbody></table>";

  /* bind g-left */
  document.querySelectorAll(".g-left[data-pid]").forEach(function(td){
    td.addEventListener("click",function(e){
      e.stopPropagation();
      openPanel(td.getAttribute("data-pid"));
    });
  });

  /* draw bars + dots */
  projects.forEach(function(p){
    var color=projColorMap[p.id]||"#a8dadc";
    allTasks.filter(function(t){return t.project_id===p.id;}).forEach(function(t){
      var row=document.querySelector('tr[data-tid="'+t.id+'"]');
      if(!row) return;
      var cells=Array.from(row.querySelectorAll(".g-cell"));
      var user=allUsers.find(function(u){return u.id===t.assigned_to;});

      /* work bar */
      if(t.start_date&&t.end_date){
        var si=days.indexOf(t.start_date),ei=days.indexOf(t.end_date);
        if(si>=0&&si<cells.length){
          var rei=ei<0?days.length-1:Math.min(ei,days.length-1);
          var bar=document.createElement("div");
          bar.className="g-bar";
          bar.style.cssText="left:2px;width:"+Math.max((rei-si+1)*CW-4,CW-4)+"px;background:"+color+";";
          bar.textContent=t.task_type||"";
          bar.addEventListener("mouseenter",function(ev){
            showTooltip(ev,"<b>"+(t.task_type||"")+"</b><br>"+(user?user.name:"Chua phan cong")+"<br>"+t.start_date+" → "+t.end_date);
          });
          bar.addEventListener("mouseleave",hideTooltip);
          cells[si].appendChild(bar);
        }
      }

      /* DOT XANH: receive_date tu project_tasks */
      if(t.receive_date){
        var ri=days.indexOf(t.receive_date);
        if(ri>=0&&ri<cells.length){
          var dot=document.createElement("div");
          dot.className="g-dot g-dot-rcv";
          dot.style.left="50%";
          (function(task){
            dot.addEventListener("mouseenter",function(ev){
              showTooltip(ev,"📥 Nhan data: "+task.receive_date);
            });
            dot.addEventListener("mouseleave",hideTooltip);
          })(t);
          cells[ri].appendChild(dot);
        }
      }

      /* DOT DO: send_date tu project_tasks */
      if(t.send_date){
        var si2=days.indexOf(t.send_date);
        if(si2>=0&&si2<cells.length){
          var dot2=document.createElement("div");
          dot2.className="g-dot g-dot-send";
          dot2.style.left="50%";
          (function(task){
            dot2.addEventListener("mouseenter",function(ev){
              showTooltip(ev,"📤 Ngay gui: "+task.send_date);
            });
            dot2.addEventListener("mouseleave",hideTooltip);
          })(t);
          cells[si2].appendChild(dot2);
        }
      }

      /* DOT VANG: milestone manager — hien thi o ngay bat dau task */
      var anchorIdx = t.start_date ? days.indexOf(t.start_date) : 0;
      if(anchorIdx < 0) anchorIdx = 0;
      if(anchorIdx < cells.length){
        var addDot=document.createElement("div");
        addDot.className="g-dot g-dot-add";
        addDot.style.cssText="left:80%;top:16px;";
        var msCnt=getMsForTask(t.id).length;
        (function(task, cnt){
          addDot.addEventListener("mouseenter",function(ev){
            showTooltip(ev,"🟡 "+(cnt>0?cnt+" giai doan":"Quan ly giai doan")+"<br><i>Click de mo</i>");
          });
          addDot.addEventListener("mouseleave",hideTooltip);
          addDot.addEventListener("click",function(ev){
            ev.stopPropagation();
            hideTooltip();
            openMsPanel(task);
          });
        })(t, msCnt);
        cells[anchorIdx].appendChild(addDot);
      }

      /* MILESTONE DOTS tu task_milestones */
      var ms=getMsForTask(t.id);
      ms.forEach(function(m,mi){
        var offTop  = 4  + mi*4;
        var offBot  = 26 + mi*4;

        if(m.receive_date){
          var mri=days.indexOf(m.receive_date);
          if(mri>=0&&mri<cells.length){
            var mdot=document.createElement("div");
            mdot.className="g-dot g-dot-ms-rcv";
            mdot.style.cssText="left:50%;top:"+offTop+"px;";
            (function(milestone,idx){
              mdot.addEventListener("mouseenter",function(ev){
                showTooltip(ev,"📥 Giai doan "+(idx+1)+" nhan: "+milestone.receive_date+(milestone.note?"<br>"+milestone.note:""));
              });
              mdot.addEventListener("mouseleave",hideTooltip);
              mdot.addEventListener("click",function(ev){
                ev.stopPropagation(); hideTooltip();
                openMsPanel(t);
              });
            })(m,mi);
            cells[mri].appendChild(mdot);
          }
        }

        if(m.send_date){
          var msi=days.indexOf(m.send_date);
          if(msi>=0&&msi<cells.length){
            var mdot2=document.createElement("div");
            mdot2.className="g-dot g-dot-ms-send";
            mdot2.style.cssText="left:50%;top:"+offBot+"px;";
            (function(milestone,idx){
              mdot2.addEventListener("mouseenter",function(ev){
                showTooltip(ev,"📤 Giai doan "+(idx+1)+" gui: "+milestone.send_date+(milestone.note?"<br>"+milestone.note:""));
              });
              mdot2.addEventListener("mouseleave",hideTooltip);
              mdot2.addEventListener("click",function(ev){
                ev.stopPropagation(); hideTooltip();
                openMsPanel(t);
              });
            })(m,mi);
            cells[msi].appendChild(mdot2);
          }
        }
      });
    });
  });
}
</script>
