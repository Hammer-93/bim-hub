<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VINADECO BIM Hub – My Tasks</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;min-height:100vh;}
    .topbar{display:flex;align-items:center;justify-content:space-between;background:#1a1a2e;padding:0 24px;height:52px;position:sticky;top:0;z-index:200;}
    .topbar-left{display:flex;align-items:center;gap:10px;}
    .topbar-title{color:#fff;font-size:16px;font-weight:700;}
    .topbar-right{display:flex;align-items:center;gap:12px;}
    .btn-top{background:rgba(255,255,255,.12);border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;text-decoration:none;transition:background .2s;font-family:inherit;}
    .btn-top:hover{background:rgba(255,255,255,.22);}
    .dropdown-wrap{position:relative;}
    .dropdown-trigger{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;transition:background .2s;}
    .dropdown-trigger:hover{background:rgba(255,255,255,.22);}
    .dropdown-trigger .user-name{font-weight:600;}
    .dropdown-arrow{font-size:10px;opacity:.7;}
    .dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);min-width:160px;z-index:999;overflow:hidden;display:none;}
    .dropdown-menu.open{display:block;}
    .dropdown-item{display:flex;align-items:center;gap:9px;padding:11px 16px;font-size:13px;color:#333;cursor:pointer;transition:background .15s;text-decoration:none;border:none;background:none;width:100%;font-family:inherit;}
    .dropdown-item:hover{background:#f0f7ff;color:#0077b6;}
    .dropdown-item.danger{color:#e63946;}
    .dropdown-item.danger:hover{background:#fff0f0;color:#e63946;}
    .dropdown-divider{height:1px;background:#f0f0f0;margin:4px 0;}

    /* NAV TABS */
    .nav-tabs{background:#fff;border-bottom:2px solid #e8e8e8;display:flex;align-items:center;padding:0 24px;gap:4px;position:sticky;top:52px;z-index:150;}
    .nav-tab{padding:14px 20px;font-size:13.5px;font-weight:600;color:#888;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:7px;}
    .nav-tab:hover{color:#0096c7;}
    .nav-tab.active{color:#0077b6;border-bottom-color:#0077b6;}
    .nav-drop{position:relative;}
    .nav-drop-trigger{padding:14px 20px;font-size:13.5px;font-weight:600;color:#888;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px;transition:all .2s;white-space:nowrap;user-select:none;}
    .nav-drop-trigger:hover{color:#0096c7;}
    .nav-drop-trigger.active{color:#0077b6;border-bottom-color:#0077b6;}
    .nav-drop-arrow{font-size:10px;opacity:.6;transition:transform .2s;}
    .nav-drop-trigger.open .nav-drop-arrow{transform:rotate(180deg);}
    .nav-drop-menu{position:absolute;top:calc(100% + 2px);left:0;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.13);min-width:190px;z-index:300;display:none;overflow:hidden;border:1px solid #eee;}
    .nav-drop-menu.open{display:block;}
    .nav-drop-item{display:flex;align-items:center;gap:9px;padding:11px 18px;font-size:13px;font-weight:600;color:#555;text-decoration:none;transition:background .15s;}
    .nav-drop-item:hover{background:#f0f7ff;color:#0077b6;}
    .nav-drop-item.active{color:#0077b6;background:#e8f4fe;}

    .main{max-width:1100px;margin:28px auto;padding:0 24px;}
    .page-title{font-size:22px;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
    .page-sub{font-size:13px;color:#888;margin-bottom:24px;}
    .card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:24px 28px;margin-bottom:24px;}
    .card-title{font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:16px;padding-bottom:12px;border-bottom:1.5px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;gap:8px;}
    table{width:100%;border-collapse:collapse;}
    thead th{padding:11px 14px;text-align:left;font-size:11.5px;font-weight:700;color:#fff;background:#0077b6;}
    thead th:first-child{border-radius:8px 0 0 0;}
    thead th:last-child{border-radius:0 8px 0 0;}
    tbody td{padding:12px 14px;font-size:13px;color:#333;border-bottom:1px solid #f0f0f0;}
    tbody tr:hover td{background:#f8fbff;}
    .type-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;}
    .status-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
    .st-active{background:#d4edda;color:#1a7c3a;}
    .st-done{background:#f0f0f0;color:#666;}
    .btn-primary{display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,#0096c7,#0077b6);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(0,119,182,.2);transition:all .2s;}
    .btn-primary:hover{box-shadow:0 6px 18px rgba(0,119,182,.35);transform:translateY(-1px);}
    .btn-sm{border:1.5px solid;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11.5px;font-weight:600;background:#fff;transition:all .15s;white-space:nowrap;}
    .btn-edit{border-color:#b8dff5;color:#0077b6;}.btn-edit:hover{background:#e8f4fe;}
    .btn-done{border-color:#d4edda;color:#1a7c3a;}.btn-done:hover{background:#f0fff4;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.open{display:flex;}
    .modal{background:#fff;border-radius:16px;padding:28px 32px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.25);animation:slideIn .3s ease;}
    @keyframes slideIn{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
    .modal-title{font-size:17px;font-weight:700;color:#1a1a2e;margin-bottom:18px;padding-bottom:12px;border-bottom:1.5px solid #f0f0f0;display:flex;align-items:center;gap:10px;}
    .modal-close{margin-left:auto;background:none;border:none;font-size:20px;cursor:pointer;color:#aaa;}
    .modal-close:hover{color:#e63946;}
    .form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
    label{font-size:12px;font-weight:600;color:#555;}
    input[type=text],input[type=date],select,textarea{width:100%;padding:9px 12px;border:1.5px solid #dde2ea;border-radius:8px;font-size:13px;outline:none;transition:border-color .2s;font-family:inherit;color:#222;}
    input:focus,select:focus,textarea:focus{border-color:#0096c7;box-shadow:0 0 0 3px rgba(0,150,199,.1);}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
    .btn-secondary{background:#fff;color:#555;border:1.5px solid #dde2ea;padding:9px 20px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;}
    .btn-secondary:hover{background:#f5f5f5;}
    .toast{position:fixed;bottom:24px;right:24px;background:#1a1a2e;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9999;transform:translateY(80px);opacity:0;transition:all .35s;}
    .toast.show{transform:translateY(0);opacity:1;}
    .toast.success{border-left:4px solid #52b788;}
    .toast.error{border-left:4px solid #e63946;}
    .empty-msg{text-align:center;padding:32px;color:#aaa;font-size:14px;}
    .proj-chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;margin-right:4px;}
  </style>
</head>
<body>

<nav class="topbar">
  <div class="topbar-left">
    <span class="topbar-title">VINADECO BIM Hub</span>
  </div>
  <div class="topbar-right">
    <div class="dropdown-wrap" id="userDropWrap">
      <button class="dropdown-trigger" id="userDropBtn">
        <span class="user-name" id="topName">...</span>
        <span class="dropdown-arrow">&#x25BC;</span>
      </button>
      <div class="dropdown-menu" id="userDropMenu">
        <a class="dropdown-item admin-only" href="admin.html" style="display:none;">&#x1F465; Member</a>
        <div class="dropdown-divider admin-only" style="display:none;"></div>
        <button class="dropdown-item danger" onclick="logout()">&#x1F6AA; Sign Out</button>
      </div>
    </div>
  </div>
</nav>

<div class="nav-tabs">
  <div class="nav-drop" id="scheduleNavDrop">
    <div class="nav-drop-trigger" id="scheduleNavTrigger">
      &#x1F4C5; Project Schedule <span class="nav-drop-arrow">&#x25BC;</span>
    </div>
    <div class="nav-drop-menu" id="scheduleNavMenu">
      <a class="nav-drop-item" href="view-list.html">&#x1F4CB; List of Project</a>
      <a class="nav-drop-item" href="view-category.html">&#x1F5C2;&#xFE0F; Type of Work</a>
      <a class="nav-drop-item" href="view-schedule.html">&#x1F4C5; Gantt Schedule</a>
    </div>
  </div>
  <a class="nav-tab" href="view-staff.html">&#x1F465; Staff Schedule</a>
  <a class="nav-tab active" href="my-tasks.html">&#x1F4CB; My Tasks</a>
</div>

<div class="toast" id="toast"></div>

<div class="main">
  <div class="page-title">&#x1F4CB; My Task Schedule</div>
  <div class="page-sub" id="mySubTitle">View and update your task progress</div>

  <div class="card">
    <div class="card-title">
      <span>&#x1F5C2;&#xFE0F; Assigned Task List</span>
      <button class="btn-primary" onclick="openAddModal()">&#x2795; Add Task</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Project</th>
          <th>Type of Work</th>
          <th>Receive</th>
          <th>Start</th>
          <th>End</th>
          <th>Send</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="myTaskTable">
        <tr><td colspan="8" class="empty-msg">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- MODAL ADD / EDIT TASK -->
<div class="modal-overlay" id="taskModal" onclick="closeModalOutside(event,'taskModal')">
  <div class="modal">
    <div class="modal-title">
      &#x1F4CB; <span id="modalTaskTitle">Add New Task</span>
      <button class="modal-close" onclick="closeModal('taskModal')">&#x2715;</button>
    </div>
    <div class="form-group">
      <label>Project</label>
      <select id="taskProjSel"></select>
    </div>
    <div class="form-group">
      <label>Type of Work</label>
      <select id="taskTypeSel">
        <option>&#x30D1;&#x30FC;&#x30B9;&#x30FB;&#x52D5;&#x753B;</option>
        <option>&#x610F;&#x5320;&#x30E2;&#x30C7;&#x30EB;</option>
        <option>&#x69CB;&#x9020;&#x30E2;&#x30C7;&#x30EB;</option>
        <option>&#x6E05;&#x7B97;&#x30E2;&#x30C7;&#x30EB;</option>
        <option>&#x56F3;&#x9762;</option>
        <option>&#x65BD;&#x5DE5;&#x30B9;&#x30C6;&#x30C3;&#x30D7;</option>
      </select>
    </div>
    <div class="form-group"><label>Receive Date</label><input type="date" id="taskRcv"/></div>
    <div class="form-group"><label>Start Date</label><input type="date" id="taskStart"/></div>
    <div class="form-group"><label>End Date</label><input type="date" id="taskEnd"/></div>
    <div class="form-group"><label>Send Date</label><input type="date" id="taskSend"/></div>
    <div class="form-group"><label>Note</label><textarea id="taskNote" rows="2" placeholder="Additional notes..."></textarea></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('taskModal')">Cancel</button>
      <button class="btn-primary" onclick="saveTask()">&#x1F4BE; Save</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://oyvwattigkqnimlmrqnj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_kcQtVjFP0m4ecWySEiwdEQ_rKFz1nn6';
  const HDRS = {
    'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,
    'Content-Type':'application/json','Prefer':'return=representation'
  };
  const PASTEL = ['#a8dadc','#b5ead7','#ffdac1','#c7ceea','#ffb7b2','#e2f0cb','#bee5eb','#d4b8e0','#f7c59f','#a0c4ff'];
  const TASK_TYPES = ['\u30d1\u30fc\u30b9\u30fb\u52d5\u753b','\u610f\u5320\u30e2\u30c7\u30eb','\u69cb\u9020\u30e2\u30c7\u30eb','\u6e05\u7b97\u30e2\u30c7\u30eb','\u56f3\u9762','\u65bd\u5de5\u30b9\u30c6\u30c3\u30d7'];
  const TYPE_COLORS = {'\u30d1\u30fc\u30b9\u30fb\u52d5\u753b':'#f4a261','\u610f\u5320\u30e2\u30c7\u30eb':'#4cc9f0','\u69cb\u9020\u30e2\u30c7\u30eb':'#52b788','\u6e05\u7b97\u30e2\u30c7\u30eb':'#9b5de5','\u56f3\u9762':'#e63946','\u65bd\u5de5\u30b9\u30c6\u30c3\u30d7':'#ffd166'};

  let myUserId   = null;
  let allProjects= [];
  let myTasks    = [];
  let editTaskId = null;

  function initTopbar() {
    var role = localStorage.getItem('user_role') || 'Staff';
    var name = localStorage.getItem('user_name') || 'User';
    var email = localStorage.getItem('user_email') || '';
    if (!email) { window.location.href='index.html'; return; }
    document.getElementById('topName').textContent = name;
    document.getElementById('mySubTitle').textContent = name + ' \u2013 ' + email;
    if (role === 'Admin') {
      var els = document.querySelectorAll('.admin-only');
      for (var i=0;i<els.length;i++) els[i].style.display='flex';
    }
    var dropBtn  = document.getElementById('userDropBtn');
    var dropMenu = document.getElementById('userDropMenu');
    dropBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      dropMenu.classList.toggle('open');
    });
    document.addEventListener('click', function() {
      dropMenu.classList.remove('open');
    });
  }

  function initNavDrop() {
    var trigger = document.getElementById('scheduleNavTrigger');
    var menu    = document.getElementById('scheduleNavMenu');
    trigger.addEventListener('click', function(e) {
      e.stopPropagation();
      trigger.classList.toggle('open');
      menu.classList.toggle('open');
    });
    document.addEventListener('click', function() {
      trigger.classList.remove('open');
      menu.classList.remove('open');
    });
  }

  window.onload = async () => {
    initTopbar();
    initNavDrop();
    const email = localStorage.getItem('user_email') || '';
    await loadMyUserId(email);
    await loadData();
  };

  async function loadMyUserId(email) {
    if (!email) return;
    const res = await fetch(SUPABASE_URL+'/rest/v1/users?email=eq.'+encodeURIComponent(email)+'&select=id',{headers:HDRS});
    const data = await res.json();
    if (data.length) myUserId = data[0].id;
  }

  async function loadData() {
    try {
      const [pRes, tRes] = await Promise.all([
        fetch(SUPABASE_URL+'/rest/v1/projects?select=*&order=created_at.desc',{headers:HDRS}),
        myUserId
          ? fetch(SUPABASE_URL+'/rest/v1/project_tasks?assigned_to=eq.'+myUserId+'&select=*&order=start_date.asc',{headers:HDRS})
          : Promise.resolve({json:()=>[]}),
      ]);
      allProjects = await pRes.json();
      myTasks     = await tRes.json();
      renderMyTasks();
      populateProjSelect();
    } catch(e) { showToast('Error loading data','error'); }
  }

  function renderMyTasks() {
    const tbody = document.getElementById('myTaskTable');
    if (!myTasks.length) {
      tbody.innerHTML='<tr><td colspan="8" class="empty-msg">No tasks assigned yet.</td></tr>';
      return;
    }
    tbody.innerHTML = myTasks.map(t => {
      const proj  = allProjects.find(p => p.id===t.project_id);
      const color = proj ? (PASTEL[allProjects.indexOf(proj)%PASTEL.length]) : '#aaa';
      const tc    = TYPE_COLORS[t.task_type] || '#888';
      const stBadge = t.status==='done'
        ? '<span class="status-badge st-done">&#x2705; Done</span>'
        : '<span class="status-badge st-active">&#x1F528; In Progress</span>';
      const projCode = proj ? (proj.code ? proj.code.split('_')[0] : '') : '';
      const projName = proj ? proj.project_name : '\u2013';
      return '<tr>'
        +'<td>'+(proj?'<span class="proj-chip" style="background:'+color+';color:#333;">'+projCode+'</span>'+projName:'\u2013')+'</td>'
        +'<td><span class="type-badge" style="background:'+tc+';">'+(t.task_type||'\u2013')+'</span></td>'
        +'<td>'+(t.receive_date||'\u2013')+'</td>'
        +'<td>'+(t.start_date||'\u2013')+'</td>'
        +'<td>'+(t.end_date||'\u2013')+'</td>'
        +'<td>'+(t.send_date||'\u2013')+'</td>'
        +'<td>'+stBadge+'</td>'
        +'<td><div style="display:flex;gap:6px;">'
        +'<button class="btn-sm btn-edit" onclick="openEditModal(\''+t.id+'\')">&#x270F;&#xFE0F; Edit</button>'
        +(t.status!=='done'?'<button class="btn-sm btn-done" onclick="markDone(\''+t.id+'\')">&#x2705; Done</button>':'')
        +'</div></td>'
        +'</tr>';
    }).join('');
  }

  function populateProjSelect() {
    const sel = document.getElementById('taskProjSel');
    sel.innerHTML = allProjects.map(p =>
      '<option value="'+p.id+'">'+p.project_name+' ('+(p.code||'')+')</option>'
    ).join('');
  }

  function openAddModal() {
    editTaskId = null;
    document.getElementById('modalTaskTitle').textContent = 'Add New Task';
    ['taskRcv','taskStart','taskEnd','taskSend'].forEach(id => document.getElementById(id).value='');
    document.getElementById('taskNote').value = '';
    document.getElementById('taskModal').classList.add('open');
  }

  function openEditModal(id) {
    const t = myTasks.find(x => x.id===id);
    if (!t) return;
    editTaskId = id;
    document.getElementById('modalTaskTitle').textContent = 'Edit Task';
    document.getElementById('taskProjSel').value  = t.project_id||'';
    document.getElementById('taskTypeSel').value  = t.task_type||TASK_TYPES[0];
    document.getElementById('taskRcv').value      = t.receive_date||'';
    document.getElementById('taskStart').value    = t.start_date||'';
    document.getElementById('taskEnd').value      = t.end_date||'';
    document.getElementById('taskSend').value     = t.send_date||'';
    document.getElementById('taskNote').value     = t.note||'';
    document.getElementById('taskModal').classList.add('open');
  }

  async function saveTask() {
    const projId   = document.getElementById('taskProjSel').value;
    const taskType = document.getElementById('taskTypeSel').value;
    const rcv      = document.getElementById('taskRcv').value||null;
    const ts       = document.getElementById('taskStart').value||null;
    const te       = document.getElementById('taskEnd').value||null;
    const snd      = document.getElementById('taskSend').value||null;
    const note     = document.getElementById('taskNote').value.trim()||null;
    if (!projId) { showToast('Please select a project','error'); return; }
    try {
      if (editTaskId) {
        await fetch(SUPABASE_URL+'/rest/v1/project_tasks?id=eq.'+editTaskId,{
          method:'PATCH',headers:HDRS,
          body:JSON.stringify({task_type:taskType,receive_date:rcv,start_date:ts,end_date:te,send_date:snd,note:note})
        });
        showToast('Task updated!','success');
      } else {
        await fetch(SUPABASE_URL+'/rest/v1/project_tasks',{
          method:'POST',headers:HDRS,
          body:JSON.stringify({project_id:projId,task_type:taskType,assigned_to:myUserId,receive_date:rcv,start_date:ts,end_date:te,send_date:snd,note:note,status:'active'})
        });
        showToast('Task added!','success');
      }
      closeModal('taskModal');
      await loadData();
    } catch(e) { showToast('Error saving task','error'); }
  }

  async function markDone(id) {
    if (!confirm('Mark this task as done?')) return;
    await fetch(SUPABASE_URL+'/rest/v1/project_tasks?id=eq.'+id,{
      method:'PATCH',headers:HDRS,body:JSON.stringify({status:'done'})
    });
    showToast('Task completed!','success');
    await loadData();
  }

  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function closeModalOutside(e,id) { if(e.target.id===id) closeModal(id); }
  function logout() { if(confirm('Sign out?')){ localStorage.clear(); window.location.href='index.html'; } }
  function showToast(msg,type) {
    var t=document.getElementById('toast');
    t.textContent=msg; t.className='toast '+(type||'success')+' show';
    setTimeout(function(){t.classList.remove('show');},3200);
  }
</script>
</body>
</html>
