<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BIM Hub — Theo thể loại</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; min-height: 100vh; }

  /* TOPBAR — giống view-schedule.html */
  .topbar { display:flex; align-items:center; justify-content:space-between; background:#1a1a2e; padding:0 24px; height:52px; position:sticky; top:0; z-index:200; }
  .topbar-left { display:flex; align-items:center; gap:10px; }
  .topbar-logo { width:30px; height:30px; background:linear-gradient(135deg,#00b4d8,#0077b6); border-radius:7px; display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; font-size:15px; }
  .topbar-title { color:#fff; font-size:16px; font-weight:700; }
  .topbar-right { display:flex; align-items:center; gap:12px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#00b4d8,#0096c7); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px; }
  .user-name { color:#ddd; font-size:13px; }
  .role-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; }
  .role-admin { background:#e63946; color:#fff; }
  .role-staff { background:#0096c7; color:#fff; }
  .btn-top { background:rgba(255,255,255,.12); border:none; color:#fff; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12px; text-decoration:none; transition:background .2s; font-family:inherit; }
  .btn-top:hover { background:rgba(255,255,255,.22); }

  /* NAV TABS — giống view-schedule.html */
  .nav-tabs { background:#fff; border-bottom:2px solid #e8e8e8; display:flex; align-items:center; padding:0 24px; gap:4px; }
  .nav-tab { padding:14px 20px; font-size:13.5px; font-weight:600; color:#888; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .2s; white-space:nowrap; text-decoration:none; display:flex; align-items:center; gap:7px; }
  .nav-tab:hover { color:#0096c7; }
  .nav-tab.active { color:#0077b6; border-bottom-color:#0077b6; }

  /* STATS */
  .stats-bar { display:flex; gap:16px; padding:20px 24px 0; }
  .stat-card { background:#fff; border-radius:12px; padding:16px 28px; text-align:center; flex:1; box-shadow:0 1px 6px #0001; }
  .stat-card .num { font-size:28px; font-weight:700; }
  .stat-card .lbl { font-size:12px; color:#888; margin-top:4px; }
  .stat-card.blue .num   { color:#2196f3; }
  .stat-card.green .num  { color:#4caf50; }
  .stat-card.orange .num { color:#ff9800; }

  /* FILTER */
  .filter-bar { display:flex; gap:12px; padding:18px 24px 0; align-items:center; flex-wrap:wrap; }
  .filter-bar input, .filter-bar select {
    padding:8px 14px; border:1.5px solid #dde2ea; border-radius:8px;
    font-size:13px; outline:none; background:#fff; font-family:inherit;
  }
  .filter-bar input { flex:1; min-width:200px; }
  .filter-bar input:focus, .filter-bar select:focus { border-color:#0096c7; }

  /* CATEGORIES */
  .categories { padding:20px 24px 40px; display:flex; flex-direction:column; gap:20px; }
  .category-section { background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,.07); overflow:hidden; }
  .category-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; color:#fff; font-size:15px; font-weight:700;
    cursor:pointer; user-select:none;
  }
  .category-header .badge { background:#ffffff33; border-radius:20px; padding:2px 12px; font-size:13px; font-weight:500; }
  .category-header .toggle-icon { font-size:12px; transition:transform .2s; margin-left:8px; }
  .category-header.collapsed .toggle-icon { transform:rotate(-90deg); }

  .cat-0 .category-header { background:linear-gradient(135deg,#ff9a56,#ff6b35); }
  .cat-1 .category-header { background:linear-gradient(135deg,#667eea,#764ba2); }
  .cat-2 .category-header { background:linear-gradient(135deg,#11998e,#38ef7d); }
  .cat-3 .category-header { background:linear-gradient(135deg,#f093fb,#f5576c); }
  .cat-4 .category-header { background:linear-gradient(135deg,#4facfe,#00f2fe); }
  .cat-5 .category-header { background:linear-gradient(135deg,#f7971e,#ffd200); }

  .project-list { padding:0 16px 12px; }
  .project-row {
    display:flex; align-items:center; gap:12px;
    padding:11px 12px; border-radius:8px; cursor:pointer; transition:background .15s;
  }
  .project-row:hover { background:#f0f4f8; }
  .status-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; background:#52b788; }
  .proj-id { font-size:13px; font-weight:700; color:#0077b6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .proj-group { font-size:11px; background:#e8f4fe; color:#0077b6; border-radius:4px; padding:2px 8px; font-weight:700; flex-shrink:0; }

  .empty-msg { text-align:center; color:#bbb; padding:24px; font-size:14px; }
  .loading    { text-align:center; padding:60px; color:#999; font-size:15px; }

  /* MODAL */
  .modal-overlay { display:none; position:fixed; inset:0; background:#0005; z-index:1000; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:#fff; border-radius:16px; width:480px; max-width:95vw; max-height:85vh; overflow-y:auto; box-shadow:0 8px 40px #0003; }
  .modal-header { padding:18px 22px 14px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; }
  .modal-header h2 { font-size:15px; font-weight:700; color:#1a1a2e; }
  .modal-close { background:none; border:none; font-size:22px; cursor:pointer; color:#999; }
  .modal-body { padding:18px 22px; }
  .task-list-title { font-size:12px; font-weight:700; color:#888; margin-bottom:10px; text-transform:uppercase; letter-spacing:.6px; }
  .task-item { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:8px; background:#f0f4f8; margin-bottom:8px; }
  .task-type-badge { font-size:11px; background:#e8eaf6; color:#3949ab; border-radius:4px; padding:3px 9px; font-weight:700; }
  .task-status { font-size:11px; padding:2px 8px; border-radius:10px; font-weight:600; background:#d8f3dc; color:#1b4332; white-space:nowrap; }
  .task-date { font-size:11px; color:#999; margin-left:auto; white-space:nowrap; }

  /* TOAST & TOOLTIP — giống view-schedule.html */
  .toast { position:fixed; bottom:24px; right:24px; background:#1a1a2e; color:#fff; padding:12px 20px; border-radius:10px; font-size:13px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:9999; transform:translateY(80px); opacity:0; transition:all .35s; }
  .toast.show { transform:translateY(0); opacity:1; }
  .toast.success { border-left:4px solid #52b788; }
  .toast.error   { border-left:4px solid #e63946; }
</style>
</head>
<body>

<!-- TOPBAR -->
<nav class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">B</div>
    <span class="topbar-title">BIM Hub</span>
  </div>
  <div class="topbar-right">
    <div class="avatar" id="topAvatar">?</div>
    <span class="user-name" id="topName">...</span>
    <span class="role-badge" id="topRole"></span>
    <a class="btn-top" href="my-tasks.html">📋 Lich cua toi</a>
    <a class="btn-top admin-only" href="admin.html" style="display:none;">👥 Thanh vien</a>
    <button class="btn-top" onclick="logout()">Dang xuat</button>
  </div>
</nav>

<!-- NAV TABS -->
<div class="nav-tabs">
  <a class="nav-tab" href="view-list.html">📋 Danh sach du an</a>
  <a class="nav-tab active" href="view-category.html">🗂️ Theo the loai</a>
  <a class="nav-tab" href="view-schedule.html">📅 Schedule du an</a>
  <a class="nav-tab" href="view-staff.html">👥 Lich nhan vien</a>
</div>

<div class="toast" id="toast"></div>

<!-- STATS -->
<div class="stats-bar">
  <div class="stat-card blue">
    <div class="num" id="statTotal">—</div>
    <div class="lbl">Tong du an</div>
  </div>
  <div class="stat-card green">
    <div class="num" id="statActive">—</div>
    <div class="lbl">Dang hoat dong</div>
  </div>
  <div class="stat-card orange">
    <div class="num" id="statTasks">—</div>
    <div class="lbl">Tong task</div>
  </div>
</div>

<!-- FILTER -->
<div class="filter-bar">
  <input id="searchInput" type="text" placeholder="🔍 Tim kiem du an..."/>
  <select id="groupFilter">
    <option value="">Tat ca nhom</option>
    <option value="A">A — 設計BIM</option>
    <option value="B">B — 施工BIM</option>
    <option value="C">C — 清算</option>
    <option value="D">D — M&F</option>
  </select>
</div>

<!-- CATEGORIES -->
<div class="categories" id="categoriesContainer">
  <div class="loading">⏳ Dang tai du lieu...</div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Chi tiet task</h2>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
const TASK_TYPES_LOCAL = ['パース・動画','意匠モデル','構造モデル','清算モデル','図面','施工ステップ'];
const ACTIVE_STATUSES  = ['active','in_progress','doing','進行中','アクティブ','running','ongoing'];

function isActiveTask(t) {
  var s = (t.status || '').toLowerCase().trim();
  return ACTIVE_STATUSES.some(function(a) { return s === a.toLowerCase(); });
}
function getGroup(p) {
  return (p.proj_group || p.project_group || p.group || '').toString().toUpperCase().trim();
}
function getCode(p) { return p.project_code || p.code || p.id || ''; }
function getName(p) { return p.project_name || p.name || ''; }

window.onload = async function() {
  initTopbar();
  try {
    await loadAllData();
    console.log('[DEBUG] Project sample:', allProjects[0]);
    console.log('[DEBUG] Task sample:', allTasks[0]);
    render();
  } catch(e) {
    console.error('Load error:', e);
    document.getElementById('categoriesContainer').innerHTML =
      '<div class="empty-msg">❌ Loi tai du lieu: ' + e.message + '</div>';
  }
};

function render() {
  var search = document.getElementById('searchInput').value.toLowerCase().trim();
  var group  = document.getElementById('groupFilter').value.toUpperCase().trim();

  var activeProjectIds = new Set(
    allTasks.filter(isActiveTask).map(function(t) { return t.project_id; })
  );

  var projects = allProjects.filter(function(p) {
    if (!activeProjectIds.has(p.id)) return false;
    if (group && getGroup(p) !== group) return false;
    if (search) {
      var c = getCode(p).toLowerCase();
      var n = getName(p).toLowerCase();
      if (!c.includes(search) && !n.includes(search)) return false;
    }
    return true;
  });

  var filteredIds = new Set(projects.map(function(p) { return p.id; }));
  var activeTasks = allTasks.filter(function(t) {
    return isActiveTask(t) && filteredIds.has(t.project_id);
  });

  document.getElementById('statTotal').textContent  = projects.length;
  document.getElementById('statActive').textContent = projects.length;
  document.getElementById('statTasks').textContent  = activeTasks.length;

  var container = document.getElementById('categoriesContainer');
  container.innerHTML = '';
  var hasAny = false;

  TASK_TYPES_LOCAL.forEach(function(type, idx) {
    var typeTasks = activeTasks.filter(function(t) {
      return (t.task_type || t.type || '') === type;
    });
    var typeProjectIds = new Set(typeTasks.map(function(t) { return t.project_id; }));
    var typeProjects = projects.filter(function(p) { return typeProjectIds.has(p.id); });
    if (typeProjects.length === 0) return;
    hasAny = true;

    var section = document.createElement('div');
    section.className = 'category-section cat-' + idx;

    var header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML =
      '<span>🌸 ' + type + '</span>' +
      '<span style="display:flex;align-items:center;gap:8px;">' +
        '<span class="badge">' + typeProjects.length + ' du an</span>' +
        '<span class="toggle-icon">▼</span>' +
      '</span>';

    var list = document.createElement('div');
    list.className = 'project-list';

    header.onclick = function() {
      header.classList.toggle('collapsed');
      list.style.display = header.classList.contains('collapsed') ? 'none' : 'block';
    };

    typeProjects.forEach(function(p) {
      var grp  = getGroup(p);
      var code = getCode(p);
      var name = getName(p);
      var row  = document.createElement('div');
      row.className = 'project-row';
      row.innerHTML =
        '<span class="status-dot"></span>' +
        '<span class="proj-id" title="' + name + '">' + code + '</span>' +
        (grp ? '<span class="proj-group">' + grp + '</span>' : '');
      row.onclick = function() { openModal(p); };
      list.appendChild(row);
    });

    section.appendChild(header);
    section.appendChild(list);
    container.appendChild(section);
  });

  if (!hasAny) {
    container.innerHTML = '<div class="empty-msg">Khong co du an nao co task dang hoat dong.</div>';
  }
}

function openModal(p) {
  var code   = getCode(p);
  var tasks  = allTasks.filter(function(t) { return t.project_id === p.id; });
  var active = tasks.filter(isActiveTask);

  document.getElementById('modalTitle').textContent = code;

  var body = '';
  if (active.length > 0) {
    body += '<div class="task-list-title">Task dang hoat dong (' + active.length + ')</div>';
    active.forEach(function(t) {
      var sd = t.start_date ? t.start_date.substring(0,10) : '';
      var ed = t.end_date   ? t.end_date.substring(0,10)   : '';
      var dateStr = (sd || ed) ? (sd + (ed ? ' → ' + ed : '')) : '';
      body += '<div class="task-item">' +
        '<span class="task-type-badge">' + (t.task_type || t.type || '—') + '</span>' +
        '<span class="task-status">' + (t.status || '—') + '</span>' +
        (dateStr ? '<span class="task-date">' + dateStr + '</span>' : '') +
        '</div>';
    });
  } else {
    body = '<div style="text-align:center;color:#bbb;padding:20px;">Khong co task dang hoat dong.</div>';
  }

  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('groupFilter').addEventListener('change', render);
</script>
</body>
</html>
